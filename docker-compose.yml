# Local development stack. `docker compose up -d postgres redis` starts only infrastructure
# for the no-Docker app workflow (docs/development.md).
name: ai-detector

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_detector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_detector}
      POSTGRES_DB: ${POSTGRES_DB:-ai_detector}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_detector}:${POSTGRES_PASSWORD:-ai_detector}@postgres:5432/${POSTGRES_DB:-ai_detector}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-dev-worker-token-change-me}
      UPLOAD_PATH: /data/uploads
    volumes: ["uploads:/data/uploads"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  vision-worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: worker-1
      API_BASE_URL: http://api:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-dev-worker-token-change-me}
      UPLOAD_PATH: /data/uploads
    volumes: ["uploads:/data/uploads:ro"]
    ports: ["8001:8001"]
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api, vision-worker]

  # Level 3 (RTSP → WebRTC/HLS). Start with: docker compose --profile media up
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    profiles: ["media"]
    ports: ["8554:8554", "8889:8889", "8888:8888"]

volumes:
  postgres-data:
  redis-data:
  uploads:
