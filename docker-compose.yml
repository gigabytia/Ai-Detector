# Local development stack. `docker compose up -d postgres redis` starts only infrastructure
# for the no-Docker app workflow (docs/development.md).
name: ai-detector

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_detector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_detector}
      POSTGRES_DB: ${POSTGRES_DB:-ai_detector}
    ports: ["15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_detector}:${POSTGRES_PASSWORD:-ai_detector}@postgres:5432/${POSTGRES_DB:-ai_detector}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      TARGET_FPS: ${TARGET_FPS:-10}
      DETECTION_CONFIDENCE: ${DETECTION_CONFIDENCE:-0.25}
      LOITERING_THRESHOLD_SECONDS: ${LOITERING_THRESHOLD_SECONDS:-10}
      ZONE_ENTER_DWELL_SECONDS: ${ZONE_ENTER_DWELL_SECONDS:-0.25}
      ZONE_EXIT_GRACE_SECONDS: ${ZONE_EXIT_GRACE_SECONDS:-0.5}
      EVENT_COOLDOWN_SECONDS: ${EVENT_COOLDOWN_SECONDS:-3}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-dev-worker-token-change-me}
      SNAPSHOT_PATH: /data/snapshots
      SNAPSHOT_ENABLED: ${SNAPSHOT_ENABLED:-true}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-30}
      SNAPSHOT_CLEANUP_INTERVAL_SECONDS: ${SNAPSHOT_CLEANUP_INTERVAL_SECONDS:-3600}
      UPLOAD_PATH: /data/uploads
    volumes: ["uploads:/data/uploads", "snapshots:/data/snapshots"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  vision-worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: worker-1
      EVENT_MIN_TRACK_HITS: ${EVENT_MIN_TRACK_HITS:-3}
      LINE_HYSTERESIS: ${LINE_HYSTERESIS:-0.01}
      SEVERITY_LINE_CROSS: ${SEVERITY_LINE_CROSS:-warning}
      SEVERITY_LOITERING: ${SEVERITY_LOITERING:-warning}
      SEVERITY_ZONE_ENTER: ${SEVERITY_ZONE_ENTER:-critical}
      PERSON_TRACK_MAX_AGE: ${PERSON_TRACK_MAX_AGE:-25}
      TRACK_MATCH_IOU: ${TRACK_MATCH_IOU:-0.5}
      TRACK_ACTIVATION_CONFIDENCE: ${TRACK_ACTIVATION_CONFIDENCE:-0.25}
      API_BASE_URL: http://api:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-dev-worker-token-change-me}
      SNAPSHOT_PATH: /data/snapshots
      UPLOAD_PATH: /data/uploads
    volumes: ["uploads:/data/uploads:ro", "./models:/app/models:ro", "snapshots:/data/snapshots"]
    ports: ["8001:8001"]
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["8080:80"]
    depends_on: [api, vision-worker]

  # Level 3 (RTSP → WebRTC/HLS). Start with: docker compose --profile media up
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    profiles: ["media"]
    ports: ["8554:8554", "8889:8889", "8888:8888"]

volumes:
  postgres-data:
  redis-data:
  uploads:
  snapshots:
