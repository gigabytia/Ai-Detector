[project]
name = "ai-detector-vision-worker"
version = "0.1.0"
description = "AI Detector vision worker: capture, person detection, tracking, event rules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-detector-shared",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "redis>=8.1",
    "pydantic-settings>=2.15",
    "orjson>=3.13",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.3",
    "httpx>=0.28.1",
]

[project.scripts]
ai-detector-worker = "vision_worker.main:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vision_worker"

[tool.uv.sources]
ai-detector-shared = { workspace = true }
